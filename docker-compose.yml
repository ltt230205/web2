services:
  mysql:
    image: mysql:8.4
    container_name: fashion_mysql
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3307:3306"

    volumes:
      - fashion_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-time-zone=+07:00"
      ]

    networks:
      - fashion_network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fashion_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/../uploads

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - fashion_network

    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fashion_frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    networks:
      - fashion_network

    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  fashion_mysql_data:

networks:
  fashion_network:
    driver: bridge
